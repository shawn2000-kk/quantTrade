system:
  mode: backtest
  log_level: warn
  log_dir: /tmp/hft_backtest_logs

risk:
  max_notional: 10000000      # 回测放宽名义金额限制（分）
  max_net_qty: 100000         # 回测放宽持仓限制（手）
  max_order_rate: 10000       # 回测不限速（模拟历史撮合）
  daily_loss_limit: -5000000  # 回测放宽熔断阈值（分）

market_maker:
  instrument_id: 1
  spread_ticks: 2
  order_qty: 100
  max_inventory: 5000

monitoring:
  prometheus_port: 9091
  alert_webhook: ""
