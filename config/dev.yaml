system:
  mode: development
  log_level: debug
  log_dir: /tmp/hft_logs

risk:
  max_notional: 1000000       # 单笔最大名义金额（分）
  max_net_qty: 10000          # 最大净持仓（手）
  max_order_rate: 100         # 每秒最大报单数
  daily_loss_limit: -500000   # 日亏损熔断阈值（分）

market_maker:
  instrument_id: 1
  spread_ticks: 2
  order_qty: 100
  max_inventory: 1000

monitoring:
  prometheus_port: 9090
  alert_webhook: ""
